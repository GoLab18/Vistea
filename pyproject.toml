[project]
name = "vistea"
version = "0.1.0"
description = "Low-cost gaze tracking and control system"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "mediapipe>=0.10.35",
    "numpy>=2.4.6",
    "opencv-python>=4.13.0.92",
    "pynput>=1.8.2",
    "pyside6>=6.11.1",
    "scikit-learn>=1.9.0",
    "structlog>=26.1.0",
]

[dependency-groups]
dev = [
    "pandas>=3.0.3",
    "pytest>=9.1.1",
]

[tool.pytest]
minversion = "9.0"
pythonpath = ["src"]
testpaths = ["tests"]
