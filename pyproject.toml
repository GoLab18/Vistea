[project]
name = "vistea"
version = "0.1.0"
description = "Low-cost webcam gaze tracking and hands-free screen control"
readme = "README.md"
requires-python = ">=3.13"
keywords = [
    "eye-tracking",
    "gaze-estimation",
    "gaze-interaction",
    "webcam",
    "calibration",
    "accessibility",
    "assistive-technology",
    "human-computer-interaction",
    "mediapipe",
    "computer-vision",
]
dependencies = [
    "mediapipe>=0.10.35",
    "numpy>=2.4.6",
    "opencv-python>=4.13.0.92",
    "pynput>=1.8.2",
    "pyside6>=6.11.1",
    "scikit-learn>=1.9.0",
    "structlog>=26.1.0",
]

[project.urls]
Homepage = "https://github.com/GoLab18/Vistea"
Repository = "https://github.com/GoLab18/Vistea"
Issues = "https://github.com/GoLab18/Vistea/issues"

[dependency-groups]
cnn = [
    "torch>=2.12.1",
    "torchvision>=0.27.1",
]
dev = [
    "pandas>=3.0.3",
    "pytest>=9.1.1",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
torchvision = [{ index = "pytorch-cpu" }]

[tool.pytest]
minversion = "9.0"
pythonpath = ["src"]
testpaths = ["tests"]
